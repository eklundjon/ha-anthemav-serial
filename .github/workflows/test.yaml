name: Test

on:
  # Scoped to main: `pull_request` already covers PR branches, and an
  # unfiltered `push` made every workflow run twice per PR push.
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.test.txt
      - name: Ruff
        run: ruff check custom_components tests
      - name: Pytest
        run: pytest -q
