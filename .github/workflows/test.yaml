name: Test

on:
  # Scoped to main: `pull_request` already covers PR branches, and an
  # unfiltered `push` made every workflow run twice per PR push.
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Install the exact ruff pinned in requirements.test.txt, rather than
      # repeating the version here. That file is the single source of truth, so
      # local and CI cannot drift apart — and a Dependabot bump to it updates CI
      # in the same PR.
      - name: Install ruff (version from requirements.test.txt)
        run: |
          pin=$(grep -E '^ruff==' requirements.test.txt)
          if [ -z "$pin" ]; then
            echo "No pinned 'ruff==' line found in requirements.test.txt" >&2
            exit 1
          fi
          echo "Installing $pin"
          pip install "$pin"
      - run: ruff check custom_components tests

  pytest:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The declared minimum (hacs.json) and the latest. Each PHACC release
          # pins one exact Home Assistant version, so pinning PHACC pins HA.
          #
          # PYTHON VERSION IS PART OF THE PIN — do not collapse these onto one
          # interpreter. Home Assistant moved to Python 3.14 in 2026.3, and PHACC
          # followed exactly: 0.13.316 (HA 2026.2.3) declares Requires-Python
          # >=3.13, while 0.13.317 (HA 2026.3.1) and everything after declares
          # >=3.14. Pinning a post-2026.2 PHACC on 3.13 does not fail a test, it
          # fails `pip install` with "No matching distribution found".
          #
          # So testing current HA requires 3.14. Capping the latest job at
          # 0.13.316 to stay on 3.13 would freeze "latest" at February 2026 and
          # silently stop testing every release after it.
          #
          # The 2025.2 floor is not arbitrary either: the config flow imports
          # SOURCE_RECONFIGURE, which does not exist before HA 2024.4, and 2025.2
          # is the first release requiring Python 3.13.
          - name: "HA 2025.2 (minimum)"
            phacc: "0.13.215"   # Home Assistant 2025.2.5 (needs Python >=3.13)
            python: "3.13"
          - name: "HA latest"
            phacc: "0.13.345"   # Home Assistant 2026.7.1, stable (needs Python >=3.14)
            python: "3.14"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install test dependencies
        run: |
          # Pin PHACC (and therefore Home Assistant) first; requirements.test
          # then adds the integration's own deps without upgrading it.
          pip install "pytest-homeassistant-custom-component==${{ matrix.phacc }}"
          pip install -r requirements.test.txt

      - name: Run tests
        # Gate on coverage. Current coverage is ~97% (202 tests); the floor sits
        # a few points below so a trivial change doesn't trip it, with a little
        # extra slack because the minimum-HA job can differ slightly from the
        # latest one. Ratchet it up over time rather than letting coverage drift
        # down to meet it.
        run: >-
          pytest -q --cov=custom_components.anthemav_serial
          --cov-report=term-missing --cov-fail-under=94
